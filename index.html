<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- supp des keywords  -->
    <meta name="description" content="Lucarne, une appli qui rassemble tout ce que vous devez savoir sur les dernières actus du football.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- "meta robots" -->
    <meta name="robots" content="index, follow">
    <meta name="googlebots" content="index, follow">
    <title>Lucarne</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wdth,wght@0,75..100,300..800;1,75..100,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./content/style.css">
</head>

<body class="home custom-scrollbar-css">

    <nav class="navbar navbar-expand navbar-light topbar mb-4 static-top shadow fixed-top" id="topMenu">

        <!-- Sidebar Toggle (Topbar) -->
        <div id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
            <span></span>
        </div>

        <!-- My topMenu action btns-->
        <ul class="nav" id="topMenuBtns">
            <li>
                <button id="reduceBtn" class="topMenuBtn">
                    &#128469;
                </button>
            </li>
            <li>
                <button id="closeBtn" class="topMenuBtn">
                    &#128473;
                </button>
            </li>
        </ul>
    </nav>

    <div class="container mx-auto max-w-7xl">

        <header class="row justify-content-center mt-5 text-center">
            <div class="col-auto d-flex align-items-center">
                <h1 class="mb-0 text-white fw-semibold"><i>LUCARNE</i></h1>
            </div>
        </header>

        <div class="row justify-content-center my-3">
            <div class="col-lg-8">
                <div class="p-4 shadow rounded">
                    <form id="formulaire">
                        <input class="form-control mb-1 bg-transparent text-light" type="text" placeholder="Rechercher"
                            id="search-input">
                        <div>
                            <div class="checkbox-wrapper-46 text-light">
                                <input type="checkbox" id="cbx-46" class="inp-cbx" />
                                <label for="cbx-46" class="cbx"><span>
                                        <svg viewBox="0 0 12 10" height="10px" width="12px">
                                            <polyline points="1.5 6 4.5 9 10.5 1"></polyline>
                                        </svg></span><span><i>Trier par popularité</i></span>
                                </label>
                            </div>
                            <div class="checkbox-wrapper-46 text-light">
                                <input type="checkbox" id="cbx-46-2" class="inp-cbx" />
                                <label for="cbx-46-2" class="cbx"><span>
                                        <svg viewBox="0 0 12 10" height="10px" width="12px">
                                            <polyline points="1.5 6 4.5 9 10.5 1"></polyline>
                                        </svg></span><span><i>Chercher par tags(poste, trophée, clubs, pays)</i></span>
                                </label>
                            </div>
                        </div>
                        <ul id="result-list"
                            class="d-flex flex-column flex-wrap justify-content-center list-unstyled p-0 w-100"></ul>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <div class="loaderC">
        <div class="pt del1"></div>
        <div class="pt del2"></div>
        <div class="pt del3"></div>
    </div>

    <script src="./script/script.js"></script>
    <script src="./script/app.js"></script>
</body>

</html>
